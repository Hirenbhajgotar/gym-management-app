services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gym-app
    container_name: gym-app
    volumes:
      - .:/var/www/html
    ports:
      - "8080:8080" # Map Reverb port
    environment:
      - REVERB_HOST=0.0.0.0
      - REVERB_PORT=8080
    networks:
      - app-network

  web:
    image: nginx:latest
    container_name: gym-web
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: gym-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gym_app # Changed to match your previous database name
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - app-network

  redis:
    image: redis:alpine
    container_name: gym-redis
    ports:
      - "6379:6379"
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: gym-phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
