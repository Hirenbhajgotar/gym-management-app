log_format main_no_query '$remote_addr - $remote_user [$time_local] '
                         '"$loggable_request" $status $body_bytes_sent '
                         '"-" "$http_user_agent"';

# The webhook device token is a bearer credential in the URL path and ADMS
# sends `pushcommkey` in the query string. `try_files` rewrites `$uri` to
# `/index.php`; `$request_uri` keeps the original path and query. `$request`
# keeps the original request line, so redact any `/webhook/<segment>` path and
# drop the query string before logging. Matching any subpath/double-slash form
# avoids leaking a token when the canonical `/api/v1/biometric/webhook/` rule
# does not match. The match is case-insensitive and also covers percent-encoded
# separators (`%2Fwebhook%2F`); those requests are non-canonical and normally
# 404, but the request line is logged before routing.
map $request $loggable_request {
    ~*^(?<method>[A-Z]+)\s+(?<webhook_prefix>[^?\s]*?(?:(?:/|%2F|%25(?:25)?2F)+webhook(?:/|%2F|%25(?:25)?2F)+))[^?\s]*(\?[^\s]*)?\s+(?<protocol>HTTP/[0-9.]+)$ "$method $webhook_prefix[REDACTED] $protocol";
    ~^(?<method>[A-Z]+)\s+(?<path>[^?\s]*)(\?[^\s]*)?\s+(?<protocol>HTTP/[0-9.]+)$ "$method $path $protocol";
    default "REDACTED";
}

server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.php index.html;

    # ADMS transmits pushcommkey in the query string; never write it to access logs.
    access_log /var/log/nginx/access.log main_no_query;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_connect_timeout 300;
    }

    location ~ /\.ht {
        deny all;
    }
}